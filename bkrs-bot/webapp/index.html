<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>大БКРС</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --accent: var(--tg-theme-button-color, #c0392b);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { margin: 8px 0 4px; font-size: 28px; text-align: center; }
  h1 span { color: var(--accent); }
  .sub { text-align: center; color: var(--hint); margin: 0 0 24px; font-size: 14px; }
  form { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; padding: 12px 14px; font-size: 18px; border-radius: 12px;
    border: 1px solid transparent; background: var(--card); color: var(--text); outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    padding: 0 18px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  h2 { font-size: 13px; text-transform: uppercase; color: var(--hint); margin: 28px 0 8px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 6px 12px; border-radius: 16px; background: var(--card); color: var(--text);
    font-size: 15px; border: 0; cursor: pointer;
  }
  .clear { background: none; color: var(--hint); font-size: 13px; padding: 0; margin-top: 10px; }
  #historyBlock[hidden] { display: none; }
</style>
</head>
<body>
  <h1><span>大</span>БКРС</h1>
  <p class="sub">Большой китайско-русский словарь · bkrs.info</p>

  <form id="form" autocomplete="off">
    <input id="q" type="search" placeholder="你好 / привет / nihao" enterkeyhint="search" autofocus>
    <button type="submit">Найти</button>
  </form>

  <div id="historyBlock" hidden>
    <h2>Недавние</h2>
    <div class="chips" id="history"></div>
    <button class="clear" id="clear" type="button">Очистить историю</button>
  </div>

  <h2>Примеры</h2>
  <div class="chips" id="examples"></div>

<script>
  const BKRS = "https://bkrs.info/slovo.php?ch=";
  const KEY = "bkrs_history";
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
  }
  function saveHistory(list) {
    try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
  }

  // Открывает страницу bkrs.info внутри Mini App — показывается всё, что есть на сайте.
  function go(query) {
    query = (query || "").trim();
    if (!query) return;
    const list = [query, ...loadHistory().filter(x => x !== query)].slice(0, 20);
    saveHistory(list);
    window.location.href = BKRS + encodeURIComponent(query);
  }

  function chip(text) {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = text;
    b.onclick = () => go(text);
    return b;
  }

  function render() {
    const list = loadHistory();
    const box = document.getElementById("history");
    box.replaceChildren(...list.map(chip));
    document.getElementById("historyBlock").hidden = list.length === 0;
  }

  ["你好", "学习", "朋友", "спасибо", "zhongguo"].forEach(w =>
    document.getElementById("examples").appendChild(chip(w)));

  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    go(document.getElementById("q").value);
  });
  document.getElementById("clear").onclick = () => { saveHistory([]); render(); };

  // Бот может открыть приложение сразу с запросом: ...?q=слово
  const q = new URLSearchParams(location.search).get("q")
    || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param);
  if (q) go(q); else render();
</script>
</body>
</html>
