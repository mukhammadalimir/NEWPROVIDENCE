<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>大БКРС</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #9a9a9a);
    --line: color-mix(in srgb, var(--text) 10%, transparent);
    --accent: #c8102e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.tg) { --bg: #111111; --text: #f2f2f2; --hint: #7a7a7a; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    min-height: 100vh; padding: 14vh 24px 32px;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 480px; margin: 0 auto; }

  .logo { font-size: 15px; font-weight: 600; letter-spacing: .02em; margin-bottom: 40px; }
  .logo span { color: var(--accent); }

  form { position: relative; border-bottom: 1px solid var(--line); transition: border-color .2s; }
  form:focus-within { border-color: var(--text); }
  input {
    width: 100%; padding: 8px 32px 12px 0; border: 0; outline: none; background: none;
    color: var(--text); font: inherit; font-size: 26px; font-weight: 300;
  }
  input::placeholder { color: var(--hint); opacity: .6; }
  input::-webkit-search-cancel-button { display: none; }
  .go {
    position: absolute; right: 0; bottom: 12px; border: 0; background: none;
    color: var(--hint); font-size: 22px; line-height: 1; cursor: pointer;
  }
  form:focus-within .go { color: var(--text); }

  section { margin-top: 48px; }
  .label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: var(--hint); letter-spacing: .08em; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .label button { border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
  ul { list-style: none; }
  li button {
    width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid var(--line);
    background: none; color: var(--text); font: inherit; font-size: 17px;
    text-align: left; cursor: pointer; display: flex; justify-content: space-between;
  }
  li button::after { content: "→"; color: var(--hint); }
  li:last-child button { border-bottom: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="logo"><span>大</span>БКРС</div>

  <form id="form" autocomplete="off">
    <input id="q" type="search" placeholder="Слово" enterkeyhint="search" aria-label="Слово">
    <button class="go" type="submit" aria-label="Найти">→</button>
  </form>

  <section id="recent" hidden>
    <div class="label">Недавние <button id="clear" type="button">Очистить</button></div>
    <ul id="history"></ul>
  </section>

  <section id="examplesBlock">
    <div class="label">Например</div>
    <ul id="examples"></ul>
  </section>
</main>

<script>
  const BKRS = "https://bkrs.info/slovo.php?ch=";
  const KEY = "bkrs_history";
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.initData) {
    document.documentElement.classList.add("tg");
    tg.ready(); tg.expand();
    try { tg.setHeaderColor("bg_color"); } catch (e) {}
  }

  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } };
  const save = list => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} };

  // Открывает страницу bkrs.info внутри Mini App — показывается всё, что есть на сайте.
  function go(query) {
    query = (query || "").trim();
    if (!query) return;
    save([query, ...load().filter(x => x !== query)].slice(0, 8));
    location.href = BKRS + encodeURIComponent(query);
  }

  function item(text) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button"; b.textContent = text; b.onclick = () => go(text);
    li.appendChild(b);
    return li;
  }

  function render() {
    const list = load();
    document.getElementById("history").replaceChildren(...list.map(item));
    document.getElementById("recent").hidden = !list.length;
    document.getElementById("examplesBlock").hidden = list.length > 0;
  }

  document.getElementById("examples").append(...["你好", "学习", "спасибо"].map(item));
  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    go(document.getElementById("q").value);
  });
  document.getElementById("clear").onclick = () => { save([]); render(); };

  // Бот может открыть приложение сразу с запросом: ...?q=слово
  const q = new URLSearchParams(location.search).get("q");
  if (q) go(q); else render();
</script>
</body>
</html>
