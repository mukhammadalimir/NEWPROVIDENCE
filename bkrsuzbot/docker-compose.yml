# Запуск: docker compose up -d --build   (подробно — README.md)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bkrsuz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: bkrsuz
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bkrsuz"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env
    environment: &dburl
      DATABASE_URL: postgresql+asyncpg://bkrsuz:${POSTGRES_PASSWORD}@db:5432/bkrsuz
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}

  api:
    build: .
    env_file: .env
    environment: *dburl
    volumes: [audio:/data/audio]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment: *dburl
    command: ["python", "-m", "app.bot.main"]
    volumes: [audio:/data/audio]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  # HTTPS для Mini App (Telegram требует https). Включается: docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to api:8000
    ports: ["80:80", "443:443"]
    volumes: [caddy:/data]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  audio:
  caddy:
