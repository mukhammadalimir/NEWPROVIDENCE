name: bkrsuzbot tests
on:
  push:
    paths: ["bkrsuzbot/**", ".github/workflows/bkrsuzbot.yml"]
  pull_request:
    paths: ["bkrsuzbot/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: bkrsuz, POSTGRES_PASSWORD: bkrsuz, POSTGRES_DB: bkrsuz_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r bkrsuzbot/backend/requirements-dev.txt
      - run: cd bkrsuzbot/backend && python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bkrsuz:bkrsuz@localhost:5432/bkrsuz_test
      - run: cd bkrsuzbot/backend && python -m pytest -q
        env:
          TEST_DATABASE_URL: sqlite+aiosqlite:///test.db
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: cd bkrsuzbot/miniapp && npm ci && npm run build
